name: Daily public housing data update
on:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'development-radar.js'
      - 'development-radar.css'
      - 'housing-strategy*.js'
      - 'housing-strategy.css'
      - 'README.md'
  workflow_dispatch:
  schedule:
    # 09:10 KST (00:10 UTC). GitHub scheduled runs may be delayed.
    - cron: '10 0 * * *'
permissions:
  contents: write
concurrency:
  group: housing-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify market data collector
        run: python -m unittest discover -s tests -v
      - name: Verify rent-versus-buy strategy model and UI
        run: |
          node --check housing-strategy-model.js
          node --check housing-strategy.js
          node tests/test_strategy.js
      - name: Update public data feeds
        if: github.event_name != 'push'
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
        run: python scripts/update_data.py
      - name: Save public-only daily feed
        if: github.event_name != 'push'
        run: |
          git config user.name "home-compass-bot"
          git config user.email "home-compass-bot@users.noreply.github.com"
          git add data/daily.json data/daily.js data/development-history.json
          if [ -f data/market-history.json ]; then git add data/market-history.json; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh public housing feed"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
